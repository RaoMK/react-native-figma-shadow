name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RN_VERSION: 0.77.2 # the version the native-build smoke test scaffolds

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run the shared C++ core tests
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Icpp/figmashadow \
            cpp/test/test_main.cpp cpp/figmashadow/*.cpp -o /tmp/fstest
          /tmp/fstest

  # Scaffolds a real RN app, installs the packed tarball, drops in the example
  # screen, and compiles the native project. Catches podspec / Gradle / codegen /
  # autolinking breakage that the unit tests can't.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack # runs `prepare` (bob build); tarball name is deterministic
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: react-native-figma-shadow-*.tgz
          if-no-files-found: error

  android-build:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with: { name: tarball, path: pkg }
      - name: Scaffold app + install package
        run: |
          npx --yes @react-native-community/cli@latest init ShadowCI \
            --version "$RN_VERSION" --skip-install --skip-git-init --pm npm
          cp example/App.tsx ShadowCI/App.tsx
          cd ShadowCI
          npm install
          npm install "$GITHUB_WORKSPACE"/pkg/react-native-figma-shadow-*.tgz
      - name: assembleDebug
        working-directory: ShadowCI/android
        run: ./gradlew assembleDebug --no-daemon

  ios-build:
    needs: pack
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: tarball, path: pkg }
      - name: Scaffold app + install package
        run: |
          npx --yes @react-native-community/cli@latest init ShadowCI \
            --version "$RN_VERSION" --skip-install --skip-git-init --pm npm
          cp example/App.tsx ShadowCI/App.tsx
          cd ShadowCI
          npm install
          npm install "$GITHUB_WORKSPACE"/pkg/react-native-figma-shadow-*.tgz
          cd ios && pod install
      - name: xcodebuild (simulator, no signing)
        working-directory: ShadowCI/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ShadowCI.xcworkspace \
            -scheme ShadowCI \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
