name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run the shared C++ core tests
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Icpp/figmashadow \
            cpp/test/test_main.cpp cpp/figmashadow/*.cpp -o /tmp/fstest
          /tmp/fstest
