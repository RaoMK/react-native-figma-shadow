name: Publish to npm

on:
  # Actions tab -> "Publish to npm" -> Run workflow
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release / tag
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # prepublishOnly (typecheck + jest) and prepare (bob build) also run during
      # `npm publish`; these are here so a failure is obvious in its own step.
      - run: npm run typecheck
      - run: npm test
      - run: npm run cpp-test

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        # No --tag: every release goes to `latest`, so `npm install
        # react-native-figma-shadow` always gets the newest build.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PROV=""
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            PROV="--provenance"
          fi
          npm publish $PROV --access public
          npm dist-tag ls react-native-figma-shadow

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          awk -v v="## ${VERSION}" '
            $0 == v {grab=1; next}
            /^## / && grab {exit}
            grab {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease --latest=false" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA" $PRE
