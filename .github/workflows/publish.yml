name: Publish to npm

on:
  # Actions tab -> "Publish to npm" -> Run workflow
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to publish under (alpha, beta, latest, ...)
        required: true
        default: alpha

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release / tag
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # prepublishOnly (typecheck + jest) and prepare (bob build) also run during
      # `npm publish`; these are here so a failure is obvious in its own step.
      - run: npm run typecheck
      - run: npm test
      - run: npm run cpp-test

      - name: Read version
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish to npm
        run: |
          PROV=""
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            PROV="--provenance"
          fi
          npm publish $PROV --access public --tag "${{ github.event.inputs.dist-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          # Pull this version's section out of CHANGELOG.md, if present.
          awk -v v="## ${VERSION}" '
            $0 == v {grab=1; next}
            /^## / && grab {exit}
            grab {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA" --prerelease --latest=false
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
