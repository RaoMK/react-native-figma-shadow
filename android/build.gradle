buildscript {
  // Follow the host app's toolchain versions where it exposes them; fall back to
  // versions new enough for React Native 0.76 - 0.87+.
  ext.kotlinVersion = rootProject.ext.has("kotlinVersion")
    ? rootProject.ext["kotlinVersion"]
    : "2.0.21"

  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // Gradle aligns buildscript classpath versions upward across the build, so
    // these act as floors -- the host app's newer AGP/Kotlin win.
    classpath "com.android.tools.build:gradle:8.7.2"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${ext.kotlinVersion}"
    classpath "com.facebook.react:react-native-gradle-plugin"
  }
}

def getExtOrDefault = { name, fallback ->
  if (rootProject.ext.has(name)) return rootProject.ext.get(name)
  def prop = project.properties["FigmaShadow_" + name]
  return prop != null ? Integer.parseInt(prop.toString()) : fallback
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

android {
  namespace "com.figmashadow"

  compileSdkVersion getExtOrDefault("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion", 24)
    targetSdkVersion getExtOrDefault("targetSdkVersion", 36)

    externalNativeBuild {
      cmake {
        cppFlags "-O2", "-frtti", "-fexceptions", "-Wall"
        arguments "-DANDROID_STL=c++_shared"
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
}

react {
  jsRootDir = file("../src/")
  libraryName = "RNFigmaShadowSpec"
  codegenJavaPackageName = "com.figmashadow"
}
