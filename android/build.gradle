// No buildscript block: the Android Gradle, Kotlin and React Native Gradle
// plugins are already on the host app's root buildscript classpath (every
// New-Architecture RN app has them), and that classpath is inherited here. This
// avoids version conflicts across React Native 0.76 - 0.87+.

def getIntOrDefault = { name, fallback ->
  def value = rootProject.ext.has(name) ? rootProject.ext.get(name) : project.findProperty("FigmaShadow_" + name)
  return value != null ? value.toString().toInteger() : fallback
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

android {
  namespace "com.figmashadow"

  compileSdk getIntOrDefault("compileSdkVersion", 36)

  defaultConfig {
    minSdk getIntOrDefault("minSdkVersion", 24)
    targetSdk getIntOrDefault("targetSdkVersion", 36)

    externalNativeBuild {
      cmake {
        cppFlags "-O2", "-frtti", "-fexceptions", "-Wall"
        arguments "-DANDROID_STL=c++_shared"
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
}

react {
  jsRootDir = file("../src/")
  libraryName = "RNFigmaShadowSpec"
  codegenJavaPackageName = "com.figmashadow"
}
